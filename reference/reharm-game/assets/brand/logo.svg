<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 44" width="186" height="44" fill="none" role="img" aria-label="REHARM">
  <defs>
    <linearGradient id="reharm-chassis" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22252C"/>
      <stop offset="100%" stop-color="#14161B"/>
    </linearGradient>
  </defs>
  <!-- Tactile 4-Bar Synth App Mark -->
  <g transform="translate(2 2)">
    <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" fill="url(#reharm-chassis)" stroke="#3E4454"/>
    <rect x="4" y="4" width="32" height="32" rx="6" fill="#0C0D10" stroke="#2B2F3A" stroke-width="0.75"/>
    <!-- Bar 1: Locked Brass -->
    <rect x="8.5" y="17" width="4.5" height="14" rx="1.5" fill="#D8AD66"/>
    <circle cx="10.75" cy="13.5" r="1.35" fill="#D8AD66"/>
    <!-- Bar 2: Warm Amber -->
    <rect x="15" y="13" width="4.5" height="18" rx="1.5" fill="#E8A849"/>
    <!-- Bar 3: Twilight Lavender -->
    <rect x="21.5" y="9" width="4.5" height="22" rx="1.5" fill="#C084FC"/>
    <!-- Bar 4: Ember Coral -->
    <rect x="28" y="11" width="4.5" height="20" rx="1.5" fill="#FF7A5C"/>
  </g>
  <!-- Geometric Hardware Wordmark -->
  <text x="52" y="29" fill="#F4F1EA" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="2.2">REHARM</text>
  <!-- Hardware Studio LED Pip -->
  <circle cx="174" cy="13" r="3" fill="#E8A849"/>
</svg>
