<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reharm Daily · Daily music puzzles</title>
  <meta name="description" content="One daily sheet for every Reharm music puzzle. Play today's REHARM, keep a streak on this device, and practice the moves in Reharm Lab. No account needed." />
  <meta name="theme-color" content="#F6E9C9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1C1916" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="https://itailiors.github.io/reharm-daily/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Reharm Daily" />
  <meta property="og:title" content="Reharm Daily · Daily music puzzles" />
  <meta property="og:description" content="One daily sheet for every Reharm music puzzle. Hear it, play it, keep your streak." />
  <meta property="og:url" content="https://itailiors.github.io/reharm-daily/" />
  <meta property="og:image" content="https://itailiors.github.io/reharm-daily/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Reharm Daily: the daily sheet of music puzzles" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://itailiors.github.io/reharm-daily/og-image.jpg" />

  <link rel="icon" type="image/svg+xml" href="./assets/brand/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/brand/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />

  <!-- Theme + reduced motion before first paint (keys: daily:v1:hub:prefs) -->
  <script>
    try {
      var p = JSON.parse(localStorage.getItem('daily:v1:hub:prefs') || '{}');
      if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme;
      if (p.reducedMotion === true) document.documentElement.dataset.reducedMotion = 'true';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#board">Skip to today's puzzles</a>
  <div id="sprite-host" hidden></div>

  <main class="daily-shell" id="app" data-roster="launch" data-all-done="false" aria-busy="true">
    <div id="banners"></div>
    <header class="daily-header" id="masthead"></header>
    <section class="ritual-card" id="ritual" aria-label="Today's progress"></section>
    <section class="celebration-card" id="celebration" aria-live="polite" data-visible="false"></section>
    <div class="board" id="board" tabindex="-1"></div>
    <footer class="daily-footer" id="footer"></footer>
  </main>

  <div class="backdrop" id="backdrop" data-open="false">
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section>
  </div>

  <div class="launch-veil" id="veil" role="status" aria-live="polite" data-active="false"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" data-visible="false"></div>

  <noscript><p class="noscript">Reharm Daily needs JavaScript to read your local progress. REHARM is at <a href="https://itailiors.github.io/reharm/">itailiors.github.io/reharm</a>.</p></noscript>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
