<!DOCTYPE html>
<html lang="en" data-reduced-motion="false">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reharm Daily — Daily Music Games Hub (Prototype)</title>
  <meta property="og:title" content="Reharm Daily — Daily Music Games" />
  <meta property="og:description" content="Daily music puzzles you can hear — and play. Chords, voice-leading ladders, ear connections, groove repair, and odd meter." />
  <meta property="og:image" content="../../assets/brand/og-image.jpg" />
  <link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/brand/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    /* =========================================================================
       Base & Broadsheet Canvas ("The Daily Sheet")
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      min-height: 100dvh;
      background-color: var(--bg-canvas);
      background-image: var(--page-texture);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: 1.45;
      overflow-x: clip;
      transition: background-color var(--dur-normal) var(--ease-out),
                  color var(--dur-normal) var(--ease-out);
    }

    button, a {
      font: inherit;
      color: inherit;
      text-decoration: none;
      touch-action: manipulation;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      user-select: none;
    }

    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px var(--focus-gap);
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .display {
      font-family: var(--font-display);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .ico {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }

    .ico-sm { width: 15px; height: 15px; }
    .ico-lg { width: 22px; height: 22px; }

    /* =========================================================================
       Discreet Reviewer Control Ribbon (Prototype State Switcher)
       ========================================================================= */
    .proto-ribbon {
      position: sticky;
      top: 0;
      z-index: var(--z-header);
      background: var(--bg-well);
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .proto-ribbon::-webkit-scrollbar { display: none; }

    .proto-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      padding-right: 4px;
    }

    .proto-btn {
      min-height: 28px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: border-color var(--dur-fast) var(--ease-snap),
                  background-color var(--dur-fast) var(--ease-snap);
    }

    .proto-btn:hover {
      border-color: var(--border-ink);
      color: var(--text-primary);
    }

    .proto-btn[aria-pressed="true"],
    .proto-btn.is-active {
      background: var(--accent-primary-solid-bg);
      border-color: var(--accent-primary-solid-bg);
      color: var(--accent-primary-solid-ink);
    }

    .proto-btn.is-pen {
      border-color: var(--accent-pen-border);
      color: var(--accent-pen);
      background: var(--accent-pen-bg);
    }

    .proto-div {
      width: 1px;
      height: 18px;
      background: var(--border-subtle);
      flex-shrink: 0;
      margin: 0 2px;
    }

    /* =========================================================================
       App Shell Layout (390x844 Mobile First -> 1280x800 Desktop Broadsheet)
       ========================================================================= */
    .daily-shell {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px 14px calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      min-width: 0;
    }

    @media (min-width: 768px) {
      .daily-shell {
        padding: 22px 32px 48px;
        gap: 18px;
      }
    }

    /* System Notice Banner (Storage Blocked / Offline) */
    .system-banner {
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--status-warn-bg);
      border: 1.5px solid var(--status-warn-border);
      color: var(--status-warn-fg);
      font-size: 13px;
      line-height: 1.35;
    }
    .system-banner[data-visible="true"] {
      display: flex;
    }
    .system-banner-body {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-weight: 500;
    }
    .system-banner-close {
      min-width: 44px;
      min-height: 44px;
      margin: -8px -8px -8px 0;
      display: grid;
      place-items: center;
      border-radius: var(--radius-sm);
    }

    /* =========================================================================
       Masthead Header
       ========================================================================= */
    .daily-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-ink);
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
    }

    .logo-img {
      height: 31px;
      width: auto;
      max-width: 175px;
      display: block;
    }
    .logo-dark { display: none; }
    [data-theme="dark"] .logo-light { display: none; }
    [data-theme="dark"] .logo-dark { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .logo-light { display: none; }
      :root:not([data-theme="light"]) .logo-dark { display: block; }
    }

    @media (min-width: 768px) {
      .logo-img { height: 42px; max-width: none; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .edition-chip {
      min-height: 44px;
      padding: 0 11px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1.5px solid var(--border-ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .edition-chip:hover { background: var(--bg-elevated); }
    .edition-date { display: none; color: var(--text-muted); font-weight: 500; }
    @media (min-width: 640px) {
      .edition-date { display: inline; }
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1.5px solid var(--border-ink);
      display: grid;
      place-items: center;
      color: var(--text-primary);
      transition: background-color var(--dur-fast) var(--ease-snap);
    }
    .icon-btn:hover { background: var(--bg-elevated); }

    /* =========================================================================
       Daily Ritual Progress Card
       ========================================================================= */
    .ritual-card {
      background: var(--bg-surface);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-lg);
      padding: 13px 15px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ritual-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ritual-heading {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ritual-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
    }

    .ritual-sub {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .ritual-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .streak-pill {
      min-height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-pill);
      background: var(--accent-brass-bg);
      border: 1.5px solid var(--accent-brass-border);
      color: var(--accent-brass);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform var(--dur-fast) var(--ease-snap);
    }
    .streak-pill.is-ticking {
      animation: daily-streak-pop var(--dur-smooth) var(--ease-spring);
    }

    .btn-primary {
      min-height: 44px;
      padding: 0 16px;
      border-radius: var(--radius-pill);
      background: var(--accent-primary-solid-bg);
      color: var(--accent-primary-solid-ink);
      font-weight: 700;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform var(--dur-instant) var(--ease-snap),
                  background-color var(--dur-fast) var(--ease-snap);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-primary-hover);
    }
    .btn-primary:active:not(:disabled) {
      transform: scale(0.985);
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      min-height: 44px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      background: var(--bg-elevated);
      border: 1.5px solid var(--border-ink);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color var(--dur-fast) var(--ease-snap),
                  transform var(--dur-instant) var(--ease-snap);
    }
    .btn-secondary:hover { background: var(--bg-hover); }
    .btn-secondary:active { transform: scale(0.985); }

    .meter-track {
      display: grid;
      gap: 6px;
    }

    .meter-seg {
      position: relative;
      height: 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-well);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .meter-seg::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform var(--dur-smooth) var(--ease-out);
    }

    .meter-seg[data-seg-state="done"]::after {
      background: var(--status-done-fg);
      transform: scaleX(1);
    }
    .meter-seg[data-seg-state="in_progress"]::after {
      background: var(--wash-mustard);
      transform: scaleX(0.55);
    }
    .meter-seg[data-seg-state="ghost"] {
      border-style: dashed;
      opacity: 0.55;
    }

    /* =========================================================================
       End-of-Day All-Done Celebration Card
       ========================================================================= */
    .celebration-card {
      display: none;
      position: relative;
      overflow: hidden;
      background: var(--accent-brass-bg);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-card);
      gap: 12px;
      flex-direction: column;
      animation: daily-card-in var(--dur-smooth) var(--ease-out);
    }

    .celebration-card[data-visible="true"] {
      display: flex;
    }

    @media (min-width: 768px) {
      .celebration-card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
      }
    }

    .clean-stamp {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transform: rotate(-3deg);
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 2px solid var(--accent-pen);
      color: var(--accent-pen);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      width: fit-content;
      margin-bottom: 4px;
    }

    .celebration-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.15;
    }

    .celebration-meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .celebration-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .confetti-burst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .confetti-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      opacity: 0;
    }
    .celebration-card.is-celebrating .confetti-dot {
      animation: daily-confetti var(--dur-celebrate) var(--ease-out) forwards;
    }

    /* =========================================================================
       Section Headers & Responsive Grids
       ========================================================================= */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.15;
      margin: 0;
    }

    .section-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .launch-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }
    @media (min-width: 768px) {
      .launch-grid {
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.85fr);
        align-items: stretch;
      }
    }

    .live-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }
    @media (min-width: 768px) {
      .live-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (min-width: 1024px) {
      .live-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .soon-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }
    @media (min-width: 640px) {
      .soon-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (min-width: 960px) {
      .soon-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    /* =========================================================================
       Game Cartridge Card System
       ========================================================================= */
    .game-card {
      min-width: 0;
      width: 100%;
      background: var(--bg-surface);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: transform var(--dur-fast) var(--ease-snap),
                  box-shadow var(--dur-fast) var(--ease-snap),
                  border-color var(--dur-fast) var(--ease-snap);
      animation: daily-card-in var(--dur-normal) var(--ease-out) backwards;
      animation-delay: calc(min(var(--card-index, 0), 6) * 40ms);
    }

    @media (hover: hover) {
      .game-card:not([data-status="planned"]):hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-card-hover);
      }
    }

    .game-card[data-status="planned"] {
      background: var(--bg-elevated);
      border: 1.5px dashed var(--border-strong);
      box-shadow: none;
    }

    .game-card[data-status="lab"] {
      background: var(--bg-surface);
      border-color: var(--border-ink);
    }

    .cover-btn {
      display: block;
      width: 100%;
      text-align: left;
      border-radius: var(--radius-md);
      position: relative;
    }

    .cover-window {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-well);
      position: relative;
    }

    .cover-window img.cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform var(--dur-fast) var(--ease-snap);
    }

    @media (hover: hover) {
      .game-card:not([data-status="planned"]):hover .cover-window img.cover-img {
        transform: scale(1.015);
      }
    }

    .game-card[data-status="planned"] .cover-window img.cover-img {
      filter: saturate(0.65);
      opacity: 0.86;
    }

    .coming-stamp-overlay {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 112px;
      height: auto;
      pointer-events: none;
    }

    /* Red-pen DONE stamp */
    .stamp-done {
      position: absolute;
      top: 9px;
      right: 9px;
      transform: rotate(-6deg);
      padding: 3px 9px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 2px solid var(--accent-pen);
      color: var(--accent-pen);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
      pointer-events: none;
    }
    .game-card[data-stamping="true"] .stamp-done {
      animation: daily-stamp-land var(--dur-stamp) var(--ease-stamp);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title-btn {
      text-align: left;
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-primary);
      padding: 2px 0;
    }
    .card-title-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
      border: 1px solid transparent;
    }

    .pill-done {
      background: var(--status-done-bg);
      color: var(--status-done-fg);
      border-color: var(--status-done-border);
    }
    .pill-progress {
      background: var(--status-progress-bg);
      color: var(--status-progress-fg);
      border-color: var(--status-progress-border);
    }
    .pill-new {
      background: var(--status-new-bg);
      color: var(--status-new-fg);
      border-color: var(--status-new-border);
    }
    .pill-soon {
      background: var(--status-soon-bg);
      color: var(--status-soon-fg);
      border-color: var(--status-soon-border);
    }
    .pill-muted-ok {
      background: var(--status-muted-ok-bg);
      color: var(--status-muted-ok-fg);
    }
    .pill-audio {
      background: var(--status-audio-bg);
      color: var(--status-audio-fg);
    }
    .pill-neutral {
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }
    .pill-lab {
      background: var(--accent-brass-bg);
      color: var(--accent-brass);
      border-color: var(--accent-brass-border);
    }

    .card-pitch {
      margin: 0;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
      flex: 1;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .card-actions .btn-primary,
    .card-actions .btn-secondary {
      flex: 1;
    }

    .card-actions .btn-icon-only {
      flex: 0 0 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: var(--radius-pill);
      background: var(--bg-elevated);
      border: 1.5px solid var(--border-ink);
      display: grid;
      place-items: center;
    }

    .bell-btn[aria-pressed="true"] {
      background: var(--status-done-bg);
      border-color: var(--status-done-border);
      color: var(--status-done-fg);
    }

    /* =========================================================================
       Dialogs / Bottom Sheets (Detail, Share, Stats, Settings, Intro, Bridges)
       ========================================================================= */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: var(--z-backdrop);
      background: var(--bg-backdrop);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      animation: daily-fade-in var(--dur-normal) var(--ease-out);
    }

    .backdrop[data-open="true"] {
      display: flex;
    }

    @media (min-width: 768px) {
      .backdrop {
        align-items: center;
        padding: 24px;
      }
    }

    .sheet {
      width: 100%;
      max-width: 500px;
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--bg-surface);
      border: 2px solid var(--border-ink);
      border-bottom: none;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 16px 18px calc(22px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-sheet);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: daily-sheet-up var(--dur-smooth) var(--ease-out);
    }

    @media (min-width: 768px) {
      .sheet {
        border-bottom: 2px solid var(--border-ink);
        border-radius: var(--radius-xl);
        padding: 22px 24px;
        box-shadow: var(--shadow-modal);
      }
      .sheet.sheet-wide {
        max-width: 820px;
      }
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: -4px auto 2px;
    }
    @media (min-width: 768px) {
      .sheet-handle { display: none; }
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sheet-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .how-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .how-list li {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      align-items: start;
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .how-num {
      width: 24px;
      height: 24px;
      border-radius: 99px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-ink);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Share Card Terminal Box */
    .share-well {
      background: var(--bg-well);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      color: var(--text-primary);
      box-shadow: var(--shadow-well);
    }

    .segmented {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: var(--radius-pill);
      background: var(--bg-well);
      border: 1.5px solid var(--border-ink);
    }

    .seg-btn {
      min-height: 40px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .seg-btn[aria-pressed="true"] {
      background: var(--accent-primary-solid-bg);
      color: var(--accent-primary-solid-ink);
    }

    /* Stats & Trophy Drawer */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 640px) {
      .kpi-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .kpi-tile {
      background: var(--bg-elevated);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px;
      text-align: center;
    }

    .kpi-val {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .kpi-lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 3px;
    }

    .week-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      background: var(--bg-elevated);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 7px 4px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
    }
    .day-cell.is-hit {
      background: var(--status-done-bg);
      border-color: var(--status-done-border);
      color: var(--status-done-fg);
    }
    .day-cell.is-clean {
      box-shadow: inset 0 0 0 1.5px var(--accent-brass);
    }

    .badge-shelf {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .trophy-pin {
      background: var(--bg-well);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .trophy-pin img {
      width: 40px;
      height: 40px;
      display: block;
    }
    .trophy-pin.is-locked img {
      filter: grayscale(1);
      opacity: 0.35;
    }
    .trophy-pin span {
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text-secondary);
    }

    /* Lab Move Chip */
    .daily-lab-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: #FBF3DF;
      border: 1.8px solid #1E2A78;
      color: #1E2A78;
      min-height: 48px;
    }
    .daily-lab-chip-mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #F6E9C9;
      border: 1.5px solid #1E2A78;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      color: #A52213;
      flex-shrink: 0;
    }
    .daily-lab-chip-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.1;
    }
    .daily-lab-chip-sub {
      font-size: 11.5px;
      color: #2F3C8A;
    }
    .daily-lab-chip-go {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #A52213;
      white-space: nowrap;
    }

    /* Launch Transition Veil */
    .launch-veil {
      position: fixed;
      inset: 0;
      z-index: var(--z-launch);
      background: var(--bg-backdrop);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .launch-veil[data-active="true"] { display: flex; }
    .launch-card {
      width: 100%;
      max-width: 390px;
      background: var(--bg-surface);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-xl);
      padding: 18px;
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(14px);
      z-index: var(--z-toast);
      background: var(--accent-primary-solid-bg);
      color: var(--accent-primary-solid-ink);
      padding: 10px 16px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-normal) var(--ease-out),
                  transform var(--dur-normal) var(--ease-out);
      max-width: calc(100vw - 28px);
      text-align: center;
    }
    .toast[data-visible="true"] {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Setting Switch Row */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-title { font-weight: 700; font-size: 14px; }
    .setting-desc { font-size: 12px; color: var(--text-muted); }

    .toggle-pill {
      min-width: 68px;
      min-height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-ink);
      background: var(--bg-elevated);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
    }
    .toggle-pill[aria-pressed="true"] {
      background: var(--status-done-bg);
      border-color: var(--status-done-border);
      color: var(--status-done-fg);
    }

    /* Bridge Showcase Styles inside Modal */
    .bridge-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 768px) {
      .bridge-grid { grid-template-columns: 1fr 1fr; }
    }
    .bridge-host {
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1.5px solid var(--bridge-border);
      background: var(--bridge-bg);
      color: var(--bridge-text);
      font-family: var(--font-sans);
    }
    .bridge-host.is-reharm {
      --bridge-bg: #111215;
      --bridge-bar: #16181D;
      --bridge-elevated: #22252C;
      --bridge-border: #2B2F3A;
      --bridge-text: #F4F1EA;
      --bridge-muted: #B2B6C2;
      --bridge-accent: #E8A849;
      --bridge-accent-ink: #14120E;
    }
    .bridge-host.is-stepwise {
      --bridge-bg: #F4F1EA;
      --bridge-bar: #EFECE3;
      --bridge-elevated: #EAE6DC;
      --bridge-border: #C8C1B2;
      --bridge-text: #182026;
      --bridge-muted: #4C565E;
      --bridge-accent: #0F5E57;
      --bridge-accent-ink: #FBF3DF;
    }
    .daily-bridge-bar {
      height: 38px;
      padding: 0 12px;
      background: var(--bridge-bar);
      border-bottom: 1px solid var(--bridge-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }
    .daily-back-link { color: var(--bridge-accent); }
    .daily-next-card {
      margin: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--bridge-elevated);
      border: 1px solid var(--bridge-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .daily-next-cta {
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bridge-accent);
      color: var(--bridge-accent-ink);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* =========================================================================
       Keyframes (motion-spec.md)
       ========================================================================= */
    @keyframes daily-card-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes daily-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes daily-sheet-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes daily-stamp-land {
      0%   { opacity: 0; transform: rotate(-14deg) scale(1.48); }
      65%  { opacity: 1; transform: rotate(-5.5deg) scale(0.94); }
      100% { opacity: 1; transform: rotate(-6deg) scale(1); }
    }
    @keyframes daily-streak-pop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.2) translateY(-2px); }
      100% { transform: scale(1) translateY(0); }
    }
    @keyframes daily-confetti {
      0%   { opacity: 0.95; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx, 18px), var(--dy, -22px)) rotate(140deg) scale(0.5); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0ms !important; transition-duration: 0ms !important; }
    }
    [data-reduced-motion="true"] *,
    [data-reduced-motion="true"] *::before,
    [data-reduced-motion="true"] *::after {
      animation-duration: 0ms !important;
      transition-duration: 0ms !important;
    }
  </style>
</head>

    function applyPreset(name) {
      state.preset = name;
      state.storageBlocked = name === "storage";
      state.offline = name === "offline";
      state.bannerDismissed = false;
      state.lastStampedId = null;

      if (name === "launch" || name === "firstvisit" || name === "storage" || name === "offline") {
        state.hubStreak = 5;
        state.records = {
          reharm: { status: "new", scoreLabel: "Today's Puzzle", streak: 5, best: "96/100", played: 14 }

      } else if (name === "midday") {
        state.hubStreak = 9;
        state.records = {
          reharm: {
            status: "done",

    function getActiveGames() {
      const isFull = state.preset === "midday" || state.preset === "alldone";
      return CATALOG.games.map(g => {
        if (g.status === "lab") return { ...g, effectiveStatus: "lab" };
        if (isFull || g.status === "live") {
          return { ...g, effectiveStatus: "live" };
        }
        return { ...g, effectiveStatus: "planned" };
      });
    }

    function getLiveGames(list) {
      return list.filter(g => g.effectiveStatus === "live");
    }

    function getRecord(gameId) {
      return state.records[gameId] || { status: "new", scoreLabel: "Today's Puzzle", streak: 0, best: "—", played: 0 };
    }

    /* =========================================================================
       Rendering
       ========================================================================= */
    function renderBoard() {
      const allGames = getActiveGames();
      const live = getLiveGames(allGames);
      const planned = allGames.filter(g => g.effectiveStatus === "planned");
      const labGame = allGames.find(g => g.effectiveStatus === "lab");

      const doneList = live.filter(g => getRecord(g.id).status === "done");
      const playedCount = doneList.length;
      const totalLive = live.length;
      const isAllDone = totalLive > 0 && playedCount === totalLive;
      const isFullRoster = totalLive > 1;

      const shell = document.getElementById("app-shell");
      shell.dataset.roster = isFullRoster ? "full" : "launch";
      shell.dataset.allDone = String(isAllDone);

      // System banner (Storage Blocked or Offline)
      const banner = document.getElementById("system-banner");
      const bannerText = document.getElementById("banner-text");
      const bannerIcon = document.getElementById("banner-icon");
      if (!state.bannerDismissed && state.storageBlocked) {
        banner.dataset.visible = "true";
        bannerIcon.innerHTML = `<use href="#icon-shield-alert"/>`;
        bannerText.textContent = "Private / Storage Blocked — All games still play, but streaks and scores won't save after closing this tab.";
      } else if (!state.bannerDismissed && state.offline) {
        banner.dataset.visible = "true";
        bannerIcon.innerHTML = `<use href="#icon-wifi-off"/>`;
        bannerText.textContent = "You're offline — Cached games and today's sheet remain readable; new games need a connection to open.";
      } else {
        banner.dataset.visible = "false";
      }

      // Ritual header
      document.getElementById("ritual-title").textContent = isAllDone
        ? `Today · ${playedCount} of ${totalLive} · Clean Sheet ✓`
        : `Today · ${playedCount} of ${totalLive} played`;
      const clockSpan = document.getElementById("midnight-clock")?.textContent || "04:12:09";
      document.getElementById("ritual-sub").innerHTML = `${isAllDone ? "All done for today" : "Pick a puzzle"} · Resets in <span class="mono" id="midnight-clock">${clockSpan}</span>`;

      document.getElementById("streak-count").textContent = `${state.hubStreak}d`;

      const shareBtn = document.getElementById("btn-open-share");
      shareBtn.disabled = playedCount === 0;
      shareBtn.title = playedCount === 0 ? "Finish 1 puzzle to unlock today's share card" : "Open today's combined share card";

      // Segmented meter
      const meter = document.getElementById("meter-track");
      meter.setAttribute("aria-valuemax", String(totalLive));
      meter.setAttribute("aria-valuenow", String(playedCount));
      const segTotal = isFullRoster ? totalLive : 7;
      meter.style.gridTemplateColumns = `repeat(${segTotal}, 1fr)`;
      meter.innerHTML = "";
      if (isFullRoster) {
        live.forEach(g => {
          const rec = getRecord(g.id);
          const seg = document.createElement("div");
          seg.className = "meter-seg";
          seg.dataset.segState = rec.status === "done" ? "done" : rec.status === "in_progress" ? "in_progress" : "new";
          meter.appendChild(seg);
        });
      } else {
        // Launch: 1 live segment + 6 upcoming ghost ticks
        const liveRec = getRecord(live[0].id);
        const firstSeg = document.createElement("div");
        firstSeg.className = "meter-seg";
        firstSeg.dataset.segState = liveRec.status === "done" ? "done" : liveRec.status === "in_progress" ? "in_progress" : "new";
        meter.appendChild(firstSeg);
        for (let i = 0; i < 6; i++) {
          const gSeg = document.createElement("div");
          gSeg.className = "meter-seg";
          gSeg.dataset.segState = "ghost";
          meter.appendChild(gSeg);
        }
      }

      // All-done celebration banner
      const cel = document.getElementById("celebration-card");
      cel.dataset.visible = String(isAllDone);
      if (isAllDone) {
        cel.classList.add("is-celebrating");
        document.getElementById("celebration-title").textContent = totalLive === 1
          ? "Today's sheet is complete!"
          : `All ${totalLive} puzzles played today!`;
        document.getElementById("celebration-meta").textContent = `${state.hubStreak}-day hub streak · Next sheet drops at local midnight.`;
        spawnConfetti();
      } else {
        cel.classList.remove("is-celebrating");
      }

      // Build sections
      const container = document.getElementById("board-sections");
      container.innerHTML = "";

      if (!isFullRoster) {
        // Launch layout: Lead Puzzle + Lab Practice side by side on desktop, then 6 Coming Soon
        const head = makeSectionHead("Today's Lead Puzzle", "1 LIVE NOW");
        container.appendChild(head);

        const launchGrid = document.createElement("div");
        launchGrid.className = "launch-grid";
        launchGrid.appendChild(renderGameCard(live[0], 0));
        if (labGame) launchGrid.appendChild(renderGameCard(labGame, 1));
        container.appendChild(launchGrid);

        const notifiedCount = Object.values(state.waitlist).filter(Boolean).length;
        container.appendChild(makeSectionHead(`On the Workbench (${planned.length} Upcoming)`, `${notifiedCount} NOTIFIED`));

        planned.forEach((g, idx) => soonGrid.appendChild(renderGameCard(g, idx + 2)));
        container.appendChild(soonGrid);
      } else {
        // Full 7+ live layout: sorted In Progress -> New -> Done
        const rank = { in_progress: 0, new: 1, done: 2 };
        const sortedLive = [...live].sort((a, b) => rank[getRecord(a.id).status] - rank[getRecord(b.id).status]);

        container.appendChild(makeSectionHead("Today's Sheet", `${totalLive - playedCount} REMAINING`));

        liveGrid.className = "live-grid";
        sortedLive.forEach((g, idx) => liveGrid.appendChild(renderGameCard(g, idx)));

    function renderGameCard(game, idx) {
      const eff = game.effectiveStatus;
      const rec = getRecord(game.id);
      const playState = eff === "live" ? rec.status : eff;

      const card = document.createElement("article");
      card.className = "game-card";
      card.dataset.gameId = game.id;
      card.dataset.status = playState;
      card.style.setProperty("--card-index", String(idx));
      if (state.lastStampedId === game.id) card.dataset.stamping = "true";

      // Cover window button (opens Detail Sheet)
      const coverBtn = document.createElement("button");
      coverBtn.type = "button";
      coverBtn.className = "cover-btn";
      coverBtn.setAttribute("aria-label", `Inspect ${game.name} details`);
      coverBtn.addEventListener("click", () => openGameDetail(game.id));

      const coverWin = document.createElement("div");
      coverWin.className = "cover-window";
      const img = document.createElement("img");
      img.className = "cover-img";
      img.src = game.cover;
      img.alt = `${game.name} game preview`;
      coverWin.appendChild(img);

      if (eff === "planned") {
        const stamp = document.createElement("img");
        stamp.className = "coming-stamp-overlay";
        stamp.src = "../../assets/covers/coming-soon-stamp.svg";
        stamp.alt = "Coming soon";
        coverWin.appendChild(stamp);
      } else if (playState === "done") {
        const stamp = document.createElement("div");
        stamp.className = "stamp-done";
        stamp.textContent = `DONE · ${rec.scoreLabel.split("·")[0].trim()} ✓`;
        coverWin.appendChild(stamp);
      }
      coverBtn.appendChild(coverWin);
      card.appendChild(coverBtn);

      // Header + title
      const head = document.createElement("div");
      head.className = "card-header";
      const titleBtn = document.createElement("button");
      titleBtn.type = "button";
      titleBtn.className = "card-title-btn";
      titleBtn.textContent = game.name;
      titleBtn.addEventListener("click", () => openGameDetail(game.id));
      head.appendChild(titleBtn);

      const statusBadge = document.createElement("span");
      if (eff === "planned") {
        statusBadge.className = "pill pill-soon";
        statusBadge.textContent = "Planned";
      } else if (eff === "lab") {
        statusBadge.className = "pill pill-lab";
        statusBadge.textContent = "Practice";
      } else if (playState === "done") {
        statusBadge.className = "pill pill-done";
        statusBadge.innerHTML = `<svg class="ico-sm"><use href="#icon-check"/></svg><span>${rec.scoreLabel}</span>`;
      } else if (playState === "in_progress") {
        statusBadge.className = "pill pill-progress";
        statusBadge.textContent = `◐ ${rec.progressLabel || "In Progress"}`;
      } else {
        statusBadge.className = "pill pill-new";
        statusBadge.textContent = "● New Today";
      }
      head.appendChild(statusBadge);
      card.appendChild(head);

      // Meta badges (duration + muted-friendly)
      const badges = document.createElement("div");
      badges.className = "badge-row";
      const timePill = `<span class="pill pill-neutral"><svg class="ico-sm"><use href="#icon-clock"/></svg>~${game.estMinutes} min</span>`;
      let muteClass = "pill-neutral";
      let muteIcon = "info";
      if (game.mutedFriendly === "yes" || game.mutedFriendly === "partly") {
        muteClass = "pill-muted-ok";
        muteIcon = "check";
      } else if (game.mutedFriendly === "no") {
        muteClass = "pill-audio";
        muteIcon = "headphones";
      }
      const mutePill = `<span class="pill ${muteClass}"><svg class="ico-sm"><use href="#icon-${muteIcon}"/></svg>${game.mutedLabel}</span>`;
      badges.innerHTML = timePill + mutePill;
      card.appendChild(badges);

      // Pitch
      const pitch = document.createElement("p");
      pitch.className = "card-pitch";
      pitch.textContent = game.pitch;
      card.appendChild(pitch);

      // Action row
      const actions = document.createElement("div");
      actions.className = "card-actions";

      if (eff === "live") {
        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = playState === "done" ? "btn-secondary" : "btn-primary";
        if (playState === "done") {
          playBtn.innerHTML = `<svg class="ico-sm"><use href="#icon-play"/></svg><span>Hear &amp; Compare</span>`;
        } else if (playState === "in_progress") {
          playBtn.innerHTML = `<svg class="ico-sm"><use href="#icon-play"/></svg><span>Resume</span>`;
        } else {
          playBtn.innerHTML = `<svg class="ico-sm"><use href="#icon-play"/></svg><span>Play ${game.name}</span>`;
        }
        playBtn.addEventListener("click", () => triggerLaunch(game.id));
        actions.appendChild(playBtn);

        const detailBtn = document.createElement("button");
        detailBtn.type = "button";
        detailBtn.className = "btn-icon-only";
        detailBtn.setAttribute("aria-label", `${game.name} rules & stats`);
        detailBtn.innerHTML = `<svg class="ico"><use href="#icon-info"/></svg>`;
        detailBtn.addEventListener("click", () => openGameDetail(game.id));
        actions.appendChild(detailBtn);
      } else if (eff === "planned") {
        const isNotified = Boolean(state.waitlist[game.id]);
        const bellBtn = document.createElement("button");
        bellBtn.type = "button";
        bellBtn.className = "btn-secondary bell-btn";
        bellBtn.setAttribute("aria-pressed", String(isNotified));
        bellBtn.innerHTML = isNotified
          ? `<svg class="ico-sm"><use href="#icon-bell-check"/></svg><span>Notified ✓</span>`
          : `<svg class="ico-sm"><use href="#icon-bell"/></svg><span>Notify me</span>`;
        bellBtn.addEventListener("click", () => toggleBell(game.id));
        actions.appendChild(bellBtn);

        const previewBtn = document.createElement("button");
        previewBtn.type = "button";
        previewBtn.className = "btn-icon-only";
        previewBtn.setAttribute("aria-label", `Preview ${game.name}`);
        previewBtn.innerHTML = `<svg class="ico"><use href="#icon-info"/></svg>`;
        previewBtn.addEventListener("click", () => openGameDetail(game.id));
        actions.appendChild(previewBtn);
      } else if (eff === "lab") {
        const labBtn = document.createElement("button");
        labBtn.type = "button";
        labBtn.className = "btn-secondary";
        labBtn.innerHTML = `<svg class="ico-sm"><use href="#icon-external-link"/></svg><span>Open in Reharm Lab</span>`;
        labBtn.addEventListener("click", () => triggerLaunch(game.id));
        actions.appendChild(labBtn);
      }

      card.appendChild(actions);
      return card;
    }

    function buildShareStrings() {
      const live = getLiveGames(getActiveGames());
      const done = live.filter(g => getRecord(g.id).status === "done");
      const no = CATALOG.hub.puzzleNo;
      const isClean = done.length === live.length;
      const header = `🎹 Reharm Daily · #${no} (${done.length}/${live.length}${isClean ? " ✓ CLEAN SHEET" : ""})`;
      const lines = done.map(g => getRecord(g.id).shareText || `${g.name}: ${getRecord(g.id).scoreLabel}`);
      const footer = `🔥 Streak: ${state.hubStreak}d\nPlay today: ${CATALOG.hub.plannedUrl}`;
      const fullText = [header, ...lines, footer].join("\n");

      const compactParts = done.map(g => `${g.name} ${getRecord(g.id).scoreLabel.split("·")[0].trim()}`);
      const compactText = `🎹 Reharm Daily #${no} (${done.length}/${live.length}) — ${compactParts.join(" · ")} · 🔥 ${state.hubStreak}d · itailiors.github.io/reharm-daily/`;
      return { fullText, compactText };
    }

    function makeToggleRow(title, desc, value, onChange) {
      const row = document.createElement("div");
      row.className = "setting-row";
      row.innerHTML = `<div><div class="setting-title">${title}</div><div class="setting-desc">${desc}</div></div>`;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "toggle-pill";
      btn.setAttribute("aria-pressed", String(value));
      btn.textContent = value ? "On" : "Off";
      btn.addEventListener("click", () => {
        const next = btn.getAttribute("aria-pressed") !== "true";
        btn.setAttribute("aria-pressed", String(next));
        btn.textContent = next ? "On" : "Off";
        onChange(next);
      });
      row.appendChild(btn);
      return row;
    }

        body.appendChild(sub);

        const list = document.createElement("ol");
        list.className = "how-list";
        list.innerHTML = `
          <li><span class="how-num">1</span><span><strong>Play at your pace:</strong> REHARM is live today with 6 more musical puzzles joining the sheet.</span></li>
          <li><span class="how-num">2</span><span><strong>Muted-friendly labels:</strong> Every card tells you upfront if you can solve it silently on a train.</span></li>
          <li><span class="how-num">3</span><span><strong>Linked with Reharm Lab:</strong> Keep streaks in your browser and tap any move to practice it in the Lab.</span></li>
        `;
        body.appendChild(list);

        const ctas = document.createElement("div");
        ctas.style.cssText = "display:flex;flex-direction:column;gap:8px;";
        const playNow = document.createElement("button");
        playNow.type = "button";
        playNow.className = "btn-primary";
        playNow.innerHTML = `<svg class="ico-sm"><use href="#icon-play"/></svg><span>Jump Straight to REHARM #42 →</span>`;
        playNow.addEventListener("click", () => {
          closeSheet();
          triggerLaunch("reharm");
        });
        const openHub = document.createElement("button");
        openHub.type = "button";
        openHub.className = "btn-secondary";
        openHub.textContent = "Open Today's Sheet";
        openHub.addEventListener("click", closeSheet);
        ctas.appendChild(playNow);
        ctas.appendChild(openHub);
        body.appendChild(ctas);
      });
    }

    function openBridgeShowcase() {
      openSheet("Lab ↔ Hub ↔ Game Bridge Showcase", (body) => {
        const labBox = document.createElement("div");
        labBox.style.cssText = "background:var(--bg-elevated);border:1.5px solid var(--border-ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;";
        labBox.innerHTML = `
          <div style="font-family:var(--font-display);font-size:17px;font-weight:700;">1. Reharm Lab Toolbar Entry (Rough.js Ink Pill)</div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
            <img src="../../assets/lab-entry/lab-daily-pill.svg" alt="Daily 1 unplayed" style="height:36px;" />
            <img src="../../assets/lab-entry/lab-daily-pill-done.svg" alt="Daily all done" style="height:36px;" />
            <img src="../../assets/lab-entry/lab-daily-pill-northgate.svg" alt="Daily Northgate dark" style="height:36px;" />
            <img src="../../assets/lab-entry/lab-daily-sidebar-icon.svg" alt="Daily desktop rail" style="height:44px;" />
          </div>
        `;
        body.appendChild(labBox);

        const title2 = document.createElement("div");
        title2.innerHTML = `<div style="font-family:var(--font-display);font-size:17px;font-weight:700;">2. Drop-In Game Strip + Next-Game Nudge (Skin-Inherited)</div>`;
        body.appendChild(title2);

        const grid = document.createElement("div");
        grid.className = "bridge-grid";
        grid.innerHTML = `
          <div class="bridge-host is-reharm">
            <nav class="daily-bridge-bar">
              <span class="daily-back-link">← Reharm Daily</span>
              <span class="mono" style="color:var(--bridge-muted);font-size:11px;">REHARM #42 · 1/3</span>
            </nav>
            <div style="padding:12px 12px 0;">
              <div class="daily-lab-chip">
                <div style="display:flex;align-items:center;gap:8px;">
                  <span class="daily-lab-chip-mark">RL</span>
                  <div>
                    <div class="daily-lab-chip-title" style="font-size:14px;">Learn Tritone Sub in Reharm Lab</div>
                    <div class="daily-lab-chip-sub">?move=tritone-sub&amp;from=reharm</div>
                  </div>
                </div>
                <span class="daily-lab-chip-go">Lab ↗</span>
              </div>
            </div>
            <aside class="daily-next-card">
              <div>
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--bridge-accent);font-weight:700;">UP NEXT TODAY</div>
                <div style="font-weight:700;font-size:14px;">STEPWISE #42</div>
              </div>
              <span class="daily-next-cta">Play Next →</span>
            </aside>
          </div>
          <div class="bridge-host is-stepwise">
            <nav class="daily-bridge-bar">
              <span class="daily-back-link">← Reharm Daily</span>
              <span class="mono" style="color:var(--bridge-muted);font-size:11px;">STEPWISE #42 · 2/3</span>
            </nav>
            <div style="padding:12px 12px 0;">
              <div class="daily-lab-chip">
                <div style="display:flex;align-items:center;gap:8px;">
                  <span class="daily-lab-chip-mark">RL</span>
                  <div>
                    <div class="daily-lab-chip-title" style="font-size:14px;">Learn Diminished Pivot in Reharm Lab</div>
                    <div class="daily-lab-chip-sub">?move=diminished-pivot&amp;from=stepwise</div>
                  </div>
                </div>
                <span class="daily-lab-chip-go">Lab ↗</span>
              </div>
            </div>
            <aside class="daily-next-card">
              <div>
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--bridge-accent);font-weight:700;">UP NEXT TODAY</div>
                <div style="font-weight:700;font-size:14px;">BARLINE #42</div>
              </div>
              <span class="daily-next-cta">Play Next →</span>
            </aside>
          </div>
        `;
        body.appendChild(grid);
      }, true);
    }

    /* =========================================================================
       Interactive Actions & Controls
       ========================================================================= */
    function triggerLaunch(gameId) {
      const game = getActiveGames().find(g => g.id === gameId);
      if (!game) return;
      if (state.offline && game.effectiveStatus === "lab") {
        showToast("Offline — Reharm Lab needs a connection unless previously cached.");
        return;
      }
      state.launchTargetId = gameId;
      document.getElementById("launch-cover").src = game.cover;
      document.getElementById("launch-title").textContent = game.effectiveStatus === "lab"
        ? "Opening Reharm Lab…"
        : `Opening ${game.name} #${CATALOG.hub.puzzleNo}…`;
      document.getElementById("launch-desc").textContent = `Prototype handoff preview · Target URL: ${game.url || "TBD"} (your ${state.mutedDefault ? "muted" : "audio"} preference carries along).`;
      document.getElementById("btn-sim-complete").style.display = game.effectiveStatus === "live" ? "" : "none";
      document.getElementById("launch-veil").dataset.active = "true";
    }

    function completeGameDemo(gameId) {
      const mockScores = {
        reharm: { scoreLabel: "91/100 · Top 4%", shareText: "🎛️ REHARM: 91/100 · ▲ Top 4% Spice", labMove: { slug: "tritone-sub", label: "Tritone Sub" } },
        "chord-trench": { scoreLabel: "492m / 600m", shareText: "🌊 CHORD TRENCH: 492m/600m" },
        stepwise: { scoreLabel: "3 moves (Par)", shareText: "🪜 STEPWISE: 3 moves (PAR)", labMove: { slug: "diminished-pivot", label: "Diminished Pivot" } },
        quartet: { scoreLabel: "1 mistake · Pure Ear", shareText: "🎼 QUARTET: 1 mistake (🎧 Pure Ear)" },
        mend: { scoreLabel: "4/4 restored", shareText: "🩺 MEND: 4/4 restored", labMove: { slug: "lydian-sharp4", label: "Lydian #4 Lift" } },
        barline: { scoreLabel: "±10ms pocket", shareText: "🥁 BARLINE: ±10ms pocket" },
        tavdle: { scoreLabel: "3/6 guesses", shareText: "🎵 TAVDLE: 3/6" }
      };
      const prev = getRecord(gameId);
      const mock = mockScores[gameId] || { scoreLabel: "Done", shareText: `${gameId}: Done` };
      const wasZeroPlayed = getLiveGames(getActiveGames()).every(g => getRecord(g.id).status !== "done");
      state.records[gameId] = {
        ...prev,
        ...mock,
        status: "done",
        streak: (prev.streak || 0) + 1,
        played: (prev.played || 0) + 1
      };
      if (wasZeroPlayed) state.hubStreak += 1;
      state.lastStampedId = gameId;
      renderBoard();
      if (wasZeroPlayed) {
        const sp = document.getElementById("btn-open-stats");
        sp.classList.add("is-ticking");
        setTimeout(() => sp.classList.remove("is-ticking"), 400);
      }
      showToast(`${gameId.toUpperCase()} stamped DONE ✓`);
    }

    function toggleBell(gameId) {
      state.waitlist[gameId] = !state.waitlist[gameId];
      const name = CATALOG.games.find(g => g.id === gameId)?.name || gameId;
      renderBoard();
      showToast(state.waitlist[gameId]
        ? `Saved locally — ${name} will highlight when live.`
        : `Removed local reminder for ${name}.`);
    }

    function setTheme(mode) {
      state.theme = mode;
      if (mode === "system") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = mode;
      const labels = { system: "Theme: System", light: "Theme: Light", dark: "Theme: Dark" };
      document.getElementById("btn-cycle-theme").textContent = labels[mode];
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.dataset.visible = "true";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.dataset.visible = "false"; }, 2400);
    }

    function updateCountdown() {
      const now = new Date();
      const midnight = new Date(now);
      midnight.setHours(24, 0, 0, 0);
      const diff = Math.max(0, Math.floor((midnight - now) / 1000));
      const h = String(Math.floor(diff / 3600)).padStart(2, "0");
      const m = String(Math.floor((diff % 3600) / 60)).padStart(2, "0");
      const s = String(diff % 60).padStart(2, "0");
      const clock = document.getElementById("midnight-clock");
      if (clock) clock.textContent = `${h}:${m}:${s}`;
    }

    /* =========================================================================
       Event Wiring
       ========================================================================= */
    document.querySelectorAll(".proto-btn[data-preset]").forEach(btn => {
      btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
    });

    document.getElementById("btn-stamp-demo").addEventListener("click", () => {
      const live = getLiveGames(getActiveGames());
      const next = live.find(g => getRecord(g.id).status !== "done");
      if (next) completeGameDemo(next.id);
      else showToast("All live puzzles are already stamped Done today!");
    });

    document.getElementById("btn-open-bridges").addEventListener("click", openBridgeShowcase);
    document.getElementById("btn-cycle-theme").addEventListener("click", () => {
      const order = ["system", "light", "dark"];
      setTheme(order[(order.indexOf(state.theme) + 1) % order.length]);
    });
    document.getElementById("btn-toggle-motion").addEventListener("click", (e) => {
      state.reducedMotion = !state.reducedMotion;
      document.documentElement.dataset.reducedMotion = String(state.reducedMotion);
      e.currentTarget.setAttribute("aria-pressed", String(state.reducedMotion));
      e.currentTarget.textContent = state.reducedMotion ? "Motion: Off" : "Motion: On";
    });

    document.getElementById("btn-dismiss-banner").addEventListener("click", () => {
      state.bannerDismissed = true;
      renderBoard();
    });

    document.getElementById("btn-open-stats").addEventListener("click", openStatsDrawer);
    document.getElementById("btn-open-stats-top").addEventListener("click", openStatsDrawer);
    document.getElementById("btn-open-share").addEventListener("click", openShareModal);
    document.getElementById("btn-celebrate-share").addEventListener("click", openShareModal);
    document.getElementById("btn-celebrate-lab").addEventListener("click", () => triggerLaunch("make-the-changes"));
    document.getElementById("btn-open-intro").addEventListener("click", openIntroModal);
    document.getElementById("btn-open-settings").addEventListener("click", openSettingsSheet);
    document.getElementById("btn-close-sheet").addEventListener("click", closeSheet);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeSheet(); });

    document.getElementById("btn-launch-cancel").addEventListener("click", () => {
      document.getElementById("launch-veil").dataset.active = "false";
    });
    document.getElementById("btn-sim-complete").addEventListener("click", () => {
      document.getElementById("launch-veil").dataset.active = "false";
      if (state.launchTargetId) completeGameDemo(state.launchTargetId);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeSheet();
        document.getElementById("launch-veil").dataset.active = "false";
      }
    });

    // Boot + support URL query hooks (?preset=...&theme=...) for easy review
    const params = new URLSearchParams(location.search);
    if (params.get("theme")) setTheme(params.get("theme"));
    applyPreset(params.get("preset") || "launch");
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
