<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" fill="none" role="img" aria-label="MEND cover art">
  <rect width="480" height="270" fill="#1D1917"/>
  <!-- 4 DAW stem lanes -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">
    <!-- Lane 1: Melody (has sour clash fixed) -->
    <rect x="24" y="24" width="432" height="48" rx="8" fill="#28221F" stroke="#3E3631"/>
    <text x="38" y="52" fill="#E8DCC4">MELODY</text>
    <rect x="116" y="42" width="54" height="10" rx="5" fill="#A8C980"/>
    <rect x="178" y="34" width="58" height="10" rx="5" fill="#A8C980"/>
    <!-- Sour bug node with repair reticle -->
    <rect x="246" y="44" width="60" height="10" rx="5" fill="#F58979" stroke="#FBF3DF" stroke-width="1"/>
    <path d="M276 28V39M276 59V66" stroke="#DFB15B" stroke-width="1.6" stroke-dasharray="2 2"/>
    <circle cx="276" cy="49" r="14" stroke="#DFB15B" stroke-width="1.5"/>
    <rect x="316" y="38" width="52" height="10" rx="5" fill="#A8C980"/>
    <rect x="376" y="42" width="64" height="10" rx="5" fill="#A8C980"/>

    <!-- Lane 2: Chords -->
    <rect x="24" y="82" width="432" height="48" rx="8" fill="#28221F" stroke="#3E3631"/>
    <text x="38" y="110" fill="#C7B99E">CHORDS</text>
    <rect x="116" y="96" width="76" height="20" rx="4" fill="#372F2B" stroke="#8C7D6B"/>
    <text x="128" y="110" fill="#E8DCC4">FMaj7</text>
    <rect x="200" y="96" width="76" height="20" rx="4" fill="#372F2B" stroke="#8C7D6B"/>
    <text x="216" y="110" fill="#E8DCC4">Dm7</text>
    <rect x="284" y="96" width="76" height="20" rx="4" fill="#3D2421" stroke="#F58979"/>
    <text x="294" y="110" fill="#F58979">Gm? !</text>
    <rect x="368" y="96" width="72" height="20" rx="4" fill="#372F2B" stroke="#8C7D6B"/>
    <text x="382" y="110" fill="#E8DCC4">C13</text>

    <!-- Lane 3: Bass -->
    <rect x="24" y="140" width="432" height="48" rx="8" fill="#28221F" stroke="#3E3631"/>
    <text x="38" y="168" fill="#C7B99E">BASS</text>
    <path d="M116 168Q145 152 174 166T232 162T290 166T348 160T440 164" stroke="#7F9AC0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Lane 4: Drums -->
    <rect x="24" y="198" width="432" height="48" rx="8" fill="#28221F" stroke="#3E3631"/>
    <text x="38" y="226" fill="#C7B99E">GROOVE</text>
    <circle cx="130" cy="222" r="5" fill="#DFB15B"/><circle cx="166" cy="222" r="3" fill="#8C7D6B"/>
    <circle cx="202" cy="222" r="5" fill="#DFB15B"/><circle cx="238" cy="222" r="3" fill="#8C7D6B"/>
    <circle cx="274" cy="222" r="5" fill="#DFB15B"/><circle cx="310" cy="222" r="3" fill="#8C7D6B"/>
    <circle cx="346" cy="222" r="5" fill="#DFB15B"/><circle cx="382" cy="222" r="3" fill="#8C7D6B"/>
    <circle cx="418" cy="222" r="5" fill="#DFB15B"/>
  </g>
