<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" fill="none" role="img" aria-label="REHARM cover art">
  <defs>
    <linearGradient id="reharm-bg" x1="0" y1="0" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191B20"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>
    <linearGradient id="playhead-beam" x1="256" y1="30" x2="292" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8A849" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#E8A849" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#reharm-bg)"/>
  <!-- Subtle studio bevel frame -->
  <rect x="14" y="14" width="452" height="242" rx="12" fill="#191B20" stroke="#2B2F3A" stroke-width="1.5"/>
  <!-- Top OLED melody well -->
  <rect x="26" y="26" width="428" height="100" rx="8" fill="#0C0D10" stroke="#2B2F3A" stroke-width="1"/>
  <!-- 4 bar dividers -->
  <path d="M133 26V126M240 26V126M347 26V126" stroke="#2B2F3A" stroke-width="1"/>
  <!-- Melody contour pills -->
  <rect x="38" y="88" width="38" height="8" rx="4" fill="#343947"/>
  <rect x="82" y="70" width="36" height="8" rx="4" fill="#343947"/>
  <rect x="144" y="54" width="42" height="8" rx="4" fill="#343947"/>
  <rect x="192" y="64" width="34" height="8" rx="4" fill="#343947"/>
  <rect x="252" y="48" width="46" height="9" rx="4.5" fill="#E8A849"/>
  <rect x="304" y="60" width="32" height="8" rx="4" fill="#343947"/>
  <rect x="358" y="68" width="40" height="8" rx="4" fill="#343947"/>
  <rect x="404" y="80" width="36" height="8" rx="4" fill="#343947"/>
  <!-- Playhead sweep beam -->
  <rect x="278" y="27" width="34" height="98" fill="url(#playhead-beam)"/>
  <line x1="278" y1="27" x2="278" y2="125" stroke="#E8A849" stroke-width="2.5"/>
  <!-- 4 Chord Bar Cards -->
  <!-- Bar 1: Brass Anchor -->
  <rect x="26" y="138" width="100" height="104" rx="8" fill="#1C1A16" stroke="#8A6C3B" stroke-width="1.5"/>
  <text x="36" y="156" fill="#D8AD66" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">ANCHOR</text>
  <rect x="108" y="146" width="9" height="8" rx="1.5" stroke="#D8AD66" stroke-width="1.3"/>
  <path d="M110.2 146v-2.2a2.3 2.3 0 0 1 4.6 0V146" stroke="#D8AD66" stroke-width="1.3"/>
  <text x="36" y="192" fill="#F4F1EA" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">CMaj7</text>
  <text x="36" y="226" fill="#D8AD66" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">◆ Jazz</text>

  <!-- Bar 2: Modal Interchange -->
  <rect x="135" y="138" width="100" height="104" rx="8" fill="#171920" stroke="#C084FC" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="145" y="156" fill="#8D93A3" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">BAR 2</text>
  <text x="145" y="192" fill="#F4F1EA" font-family="'JetBrains Mono', monospace" font-size="15.5" font-weight="700">AbMaj7</text>
  <rect x="144" y="212" width="64" height="20" rx="10" fill="#C084FC" fill-opacity="0.16"/>
  <text x="152" y="226" fill="#C084FC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">◐ Modal</text>

  <!-- Bar 3: Deep Reharm -->
  <rect x="245" y="138" width="100" height="104" rx="8" fill="#1C1717" stroke="#FF7A5C" stroke-width="2"/>
  <text x="255" y="156" fill="#FF7A5C" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">BAR 3</text>
  <circle cx="315" cy="153" r="2.2" fill="#E8A849"/>
  <circle cx="323" cy="153" r="2.2" fill="#3E4454"/>
  <circle cx="331" cy="153" r="2.2" fill="#3E4454"/>
  <text x="255" y="192" fill="#F4F1EA" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">Db7#11</text>
  <rect x="254" y="212" width="62" height="20" rx="10" fill="#FF7A5C" fill-opacity="0.18"/>
  <text x="262" y="226" fill="#FF7A5C" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">▲ Deep</text>

  <!-- Bar 4: Warm Amber -->
  <rect x="354" y="138" width="100" height="104" rx="8" fill="#171920" stroke="#E8A849" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="364" y="156" fill="#8D93A3" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">BAR 4</text>
  <text x="364" y="192" fill="#F4F1EA" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">CMaj9</text>
  <rect x="363" y="212" width="60" height="20" rx="10" fill="#E8B24A" fill-opacity="0.16"/>
  <text x="371" y="226" fill="#E8B24A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">◆ Jazz</text>
</svg>
